<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Sentinel — Players</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;600;700&family=Inter:wght@400;500;600&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
<link rel="stylesheet" href="/sentinel.css">
</head>
<body>
<div class="aurora"><i class="a"></i><i class="b"></i><i class="c"></i></div>

<div class="app">
  <aside class="nav">
    <div class="wordmark">
      <div class="brand">SENTINEL</div>
      <div class="sub">BlackStone Development</div>
    </div>
    <a href="/">Overview</a>
    <a href="/timeline.html">Timeline</a>
    <a href="/performance.html">Performance</a>
    <a href="#">Economy</a>
    <a class="active" href="/players.html">Players</a>
    <a href="#">Staff Log</a>
    <a href="#">Alerts</a>
    <a href="#">Settings</a>
    <div class="foot">
      <div class="st"><span class="pulse" id="agent-pulse"></span> <span id="agent-state">Connecting…</span></div>
      <div id="agent-note">—</div>
    </div>
  </aside>

  <div class="main">
    <header class="topbar">
      <div class="server-select">srv_FAKE_LEGACY_RP</div>
      <nav class="subtabs" id="views">
        <button class="on" data-view="roster">Roster</button>
        <button data-view="ledger">Findings Ledger</button>
      </nav>
      <div class="who">
        <span class="role">OWNER</span>
        <div class="avatar">BW</div>
      </div>
    </header>

    <div class="pagehead">
      <h1 class="disp">Players</h1>
      <span class="count"><b id="player-count">0</b> seen · <b id="flagged-count">0</b> flagged</span>
    </div>

    <!-- ROSTER VIEW -->
    <section id="view-roster">
      <div class="searchrow">
        <input type="search" id="search" placeholder="Search player name…">
      </div>

      <!-- profile drawer (hidden until a row is clicked) -->
      <section class="pane profile hidden" id="profile">
        <div class="phead">
          <h2 class="disp" id="p-name">—</h2>
          <div class="chips" id="p-chips"></div>
          <button class="back" id="p-back">← back to roster</button>
        </div>
        <div id="p-findings"></div>
        <ul class="stream" id="p-events"></ul>
      </section>

      <section class="pane" id="roster-pane">
        <table>
          <thead><tr><th>Player</th><th>Status</th><th>Sessions</th><th>Econ In</th><th>Econ Out</th><th>Events</th></tr></thead>
          <tbody id="roster"><tr><td colspan="6"><div class="empty">Waiting for players…</div></td></tr></tbody>
        </table>
      </section>
    </section>

    <!-- LEDGER VIEW -->
    <section id="view-ledger" class="hidden">
      <div class="searchrow">
        <input type="search" id="l-search" placeholder="Search findings by player name…">
        <input type="date" id="l-date" title="Filter by date">
      </div>
      <div id="ledger">
        <div class="pane"><div class="empty">No findings recorded.</div></div>
      </div>
    </section>
  </div>
</div>

<script>
const $ = (id) => document.getElementById(id);
const SEV = { 'server.hitch':'warn', 'player.drop':'crit', 'player.join':'ok', 'econ.txn':'info', 'perf.resmon':'info' };

function esc(s){ return String(s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])); }
function ts(ms){ return new Date(ms).toLocaleTimeString([], { hour: '2-digit', minute: '2-digit', second: '2-digit' }); }
function dts(ms){ return new Date(ms).toLocaleString([], { month: 'short', day: 'numeric', hour: '2-digit', minute: '2-digit' }); }

let allPlayers = [];
let allFindings = [];

function describe(ev) {
  const d = ev.data || {};
  switch (ev.type) {
    case 'player.join':  return `connected`;
    case 'player.drop':  return `dropped — ${esc(d.reason || 'unknown')}${d.session_s ? ` · session ${Math.round(d.session_s/60)}m` : ''}`;
    case 'econ.txn':     return `${d.direction === 'in' ? 'deposited' : 'withdrew'} $${(d.amount || 0).toLocaleString()} <span style="color:var(--txt-faint)">(src: ${esc(d.source || '—')})</span>`;
    default:             return `<b>${esc(ev.type)}</b>`;
  }
}

// ---- roster ----
function renderRoster() {
  const q = $('search').value.trim().toLowerCase();
  const rows = allPlayers.filter(p => !q || p.name.toLowerCase().includes(q));
  if (!rows.length) {
    $('roster').innerHTML = '<tr><td colspan="6"><div class="empty">No players match.</div></td></tr>';
    return;
  }
  $('roster').innerHTML = rows.map(p => `
    <tr data-name="${esc(p.name)}">
      <td class="pname">${esc(p.name)}</td>
      <td>${p.findings ? `<span class="flag">${p.findings} FINDING${p.findings > 1 ? 'S' : ''}</span>` : '<span class="clean">clean</span>'}</td>
      <td class="num">${p.joins}</td>
      <td class="num">$${p.econ_in.toLocaleString()}</td>
      <td class="num">$${p.econ_out.toLocaleString()}</td>
      <td class="num">${p.events}</td>
    </tr>`).join('');
}

// ---- profile ----
async function openProfile(name) {
  const res = await fetch(`/v1/player?name=${encodeURIComponent(name)}`);
  const o = await res.json();
  if (!o.ok) return;
  $('p-name').textContent = o.name;
  const p = allPlayers.find(x => x.name === name) || {};
  $('p-chips').innerHTML = [
    `<span class="chip">sessions <b>${p.joins ?? 0}</b></span>`,
    `<span class="chip">in <b>$${(p.econ_in ?? 0).toLocaleString()}</b></span>`,
    `<span class="chip">out <b>$${(p.econ_out ?? 0).toLocaleString()}</b></span>`,
    `<span class="chip">last seen <b>${p.last_seen ? dts(p.last_seen) : '—'}</b></span>`,
  ].join('');
  $('p-findings').innerHTML = (o.findings || []).map(f =>
    `<div class="pfinding"><b>${f.confidence}</b> — ${esc(f.summary)}</div>`
  ).join('');
  $('p-events').innerHTML = (o.events || []).map(ev =>
    `<li><span class="ts">${ts(ev.t)}</span><span class="sev ${SEV[ev.type] || 'info'}"></span><span class="ev"><b>${esc(name)}</b> ${describe(ev)}</span></li>`
  ).join('') || '<li><span class="ev">No events recorded.</span></li>';
  $('profile').classList.remove('hidden');
  $('roster-pane').classList.add('hidden');
}

$('p-back').addEventListener('click', () => {
  $('profile').classList.add('hidden');
  $('roster-pane').classList.remove('hidden');
});

$('roster').addEventListener('click', (e) => {
  const tr = e.target.closest('tr[data-name]');
  if (tr) openProfile(tr.dataset.name);
});

$('search').addEventListener('input', renderRoster);

// ---- findings ledger (name + date search) ----
function renderLedger() {
  const q = $('l-search').value.trim().toLowerCase();
  const day = $('l-date').value; // YYYY-MM-DD or ''
  let rows = allFindings.filter(f => f.player); // player-attributed findings
  if (q) rows = rows.filter(f => f.player.toLowerCase().includes(q));
  if (day) {
    rows = rows.filter(f => {
      const d = new Date(f.detected_at);
      const iso = `${d.getFullYear()}-${String(d.getMonth() + 1).padStart(2, '0')}-${String(d.getDate()).padStart(2, '0')}`;
      return iso === day;
    });
  }
  if (!rows.length) {
    $('ledger').innerHTML = '<div class="pane"><div class="empty">No findings match that search.</div></div>';
    return;
  }
  $('ledger').innerHTML = rows.map(f => `
    <div class="lhit ${f.confidence === 'HIGH' ? '' : 'warnf'}">
      <b>${f.confidence}</b> · <b>${esc(f.player)}</b> — ${esc(f.summary)}
      <div class="lmeta">${dts(f.detected_at)} · ${f.txn_count ?? '—'} txns · $${(f.amount ?? 0).toLocaleString()} · key ${esc(f.key)}</div>
    </div>`).join('');
}

$('l-search').addEventListener('input', renderLedger);
$('l-date').addEventListener('change', renderLedger);

// ---- view toggle ----
$('views').addEventListener('click', (e) => {
  const btn = e.target.closest('button');
  if (!btn) return;
  document.querySelectorAll('#views button').forEach(b => b.classList.remove('on'));
  btn.classList.add('on');
  $('view-roster').classList.toggle('hidden', btn.dataset.view !== 'roster');
  $('view-ledger').classList.toggle('hidden', btn.dataset.view !== 'ledger');
});

// ---- refresh loop ----
async function refresh() {
  try {
    const [pr, fr] = await Promise.all([fetch('/v1/players'), fetch('/v1/findings')]);
    const po = await pr.json();
    const fo = await fr.json();

    $('agent-pulse').classList.remove('dead');
    $('agent-state').textContent = 'Backend linked';
    $('agent-note').textContent = 'refreshing every 5 s';

    allPlayers = po.players || [];
    allFindings = fo.findings || [];
    $('player-count').textContent = allPlayers.length;
    $('flagged-count').textContent = allPlayers.filter(p => p.findings > 0).length;

    if ($('profile').classList.contains('hidden')) renderRoster();
    if (!$('view-ledger').classList.contains('hidden')) renderLedger();
  } catch (err) {
    $('agent-pulse').classList.add('dead');
    $('agent-state').textContent = 'Backend unreachable';
    $('agent-note').textContent = 'is server.js running?';
  }
}

refresh();
setInterval(refresh, 5000);
</script>
</body>
</html>
