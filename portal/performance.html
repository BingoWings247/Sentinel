<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Sentinel — Performance</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;600;700&family=Inter:wght@400;500;600&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
  :root{
    --void:#070A14; --glass:rgba(255,255,255,.055); --edge:rgba(255,255,255,.12);
    --edge-hi:rgba(255,255,255,.22); --txt:#EAF0FA; --txt-soft:#9AA6BC; --txt-faint:#5D6880;
    --cyan:#3EE6FF; --violet:#8B5CF6; --magenta:#F43F8E;
    --ok:#34E39B; --warn:#FFB84D; --crit:#FF5C5C;
  }
  *{margin:0;padding:0;box-sizing:border-box}
  body{background:var(--void);color:var(--txt);font-family:"Inter",system-ui,sans-serif;-webkit-font-smoothing:antialiased;min-height:100vh;overflow-x:hidden}
  .disp{font-family:"Space Grotesk",sans-serif}
  .mono{font-family:"JetBrains Mono",monospace}

  .aurora{position:fixed;inset:0;z-index:0;pointer-events:none;filter:blur(90px);opacity:.55}
  .aurora i{position:absolute;border-radius:50%}
  .aurora .a{width:55vw;height:55vw;left:-12vw;top:-18vw;background:radial-gradient(circle,var(--violet),transparent 65%)}
  .aurora .b{width:48vw;height:48vw;right:-10vw;top:8vh;background:radial-gradient(circle,var(--cyan),transparent 65%);opacity:.7}
  .aurora .c{width:44vw;height:44vw;left:28vw;bottom:-22vw;background:radial-gradient(circle,var(--magenta),transparent 65%);opacity:.45}
  @media (prefers-reduced-motion:no-preference){
    .aurora .a{animation:drift 26s ease-in-out infinite alternate}
    .aurora .b{animation:drift 32s ease-in-out infinite alternate-reverse}
    .aurora .c{animation:drift 38s ease-in-out infinite alternate}
    @keyframes drift{from{transform:translate(0,0) scale(1)}to{transform:translate(6vw,4vh) scale(1.15)}}
  }

  .app{position:relative;z-index:1;display:grid;grid-template-columns:240px 1fr;min-height:100vh}
  .nav{margin:16px 0 16px 16px;border-radius:20px;background:var(--glass);backdrop-filter:blur(22px);-webkit-backdrop-filter:blur(22px);border:1px solid var(--edge);border-top-color:var(--edge-hi);display:flex;flex-direction:column;padding:26px 0 20px;height:calc(100vh - 32px);position:sticky;top:16px}
  .wordmark{padding:0 24px 24px}
  .wordmark .brand{font-family:"Space Grotesk",sans-serif;font-weight:700;font-size:1.45rem;background:linear-gradient(92deg,var(--txt) 30%,var(--cyan) 75%,var(--violet));-webkit-background-clip:text;background-clip:text;color:transparent}
  .wordmark .sub{font-family:"JetBrains Mono",monospace;font-size:.58rem;letter-spacing:.22em;color:var(--txt-faint);text-transform:uppercase;margin-top:4px}
  .nav a{display:flex;align-items:center;gap:10px;margin:2px 12px;padding:9px 14px;border-radius:11px;color:var(--txt-soft);text-decoration:none;font-size:.86rem;font-weight:500}
  .nav a:hover{color:var(--txt);background:rgba(255,255,255,.05)}
  .nav a.active{color:#fff;background:linear-gradient(95deg,rgba(62,230,255,.16),rgba(139,92,246,.16));border:1px solid rgba(62,230,255,.25);box-shadow:0 0 22px rgba(62,230,255,.12)}
  .nav .foot{margin-top:auto;padding:16px 24px 0;border-top:1px solid var(--edge);font-size:.72rem;color:var(--txt-faint);line-height:1.6}
  .nav .foot .st{display:flex;align-items:center;gap:8px;color:var(--txt-soft);font-weight:500}
  .pulse{width:8px;height:8px;border-radius:50%;background:var(--ok);box-shadow:0 0 12px var(--ok)}
  .pulse.dead{background:var(--crit);box-shadow:0 0 12px var(--crit)}

  .main{min-width:0;padding:16px 16px 40px 20px}
  .topbar{display:flex;align-items:center;gap:14px;padding:14px 22px;margin-bottom:22px;border-radius:16px;background:var(--glass);backdrop-filter:blur(22px);-webkit-backdrop-filter:blur(22px);border:1px solid var(--edge);border-top-color:var(--edge-hi);flex-wrap:wrap}
  .server-select{display:flex;align-items:center;gap:9px;font-weight:600;font-size:.92rem}
  .subtabs{display:flex;gap:4px;margin-left:6px}
  .subtabs button{padding:7px 15px;border-radius:99px;font-size:.8rem;font-weight:500;font-family:"Inter",sans-serif;color:var(--txt-soft);background:none;border:none;cursor:pointer}
  .subtabs button:hover{background:rgba(255,255,255,.06);color:var(--txt)}
  .subtabs button.on{color:#fff;background:linear-gradient(95deg,var(--cyan),var(--violet));box-shadow:0 0 20px rgba(139,92,246,.45)}
  .who{margin-left:auto;display:flex;align-items:center;gap:12px}
  .role{font-family:"JetBrains Mono",monospace;font-size:.58rem;letter-spacing:.16em;border:1px solid var(--edge-hi);border-radius:6px;padding:4px 9px;color:var(--txt-soft)}
  .avatar{width:32px;height:32px;border-radius:50%;background:linear-gradient(135deg,var(--cyan),var(--violet));display:flex;align-items:center;justify-content:center;font-size:.72rem;font-weight:700;color:#0A0E1A}

  .pagehead{padding:6px 6px 20px;display:flex;align-items:baseline;gap:16px;flex-wrap:wrap}
  .pagehead h1{font-family:"Space Grotesk",sans-serif;font-weight:600;font-size:1.6rem;letter-spacing:-.015em}
  .pagehead .count{font-family:"JetBrains Mono",monospace;font-size:.72rem;color:var(--txt-soft)}
  .pagehead .count b{color:var(--cyan)}

  /* ---- Issue cards (Sentry-style) ---- */
  .issues{display:flex;flex-direction:column;gap:14px;margin-bottom:26px}
  .issue{
    background:var(--glass);backdrop-filter:blur(20px);-webkit-backdrop-filter:blur(20px);
    border:1px solid var(--edge);border-top-color:var(--edge-hi);border-radius:18px;padding:18px 20px 14px;
  }
  .issue.crit{box-shadow:0 0 44px rgba(255,92,92,.14);border-color:rgba(255,92,92,.3)}
  .issue.warn{box-shadow:0 0 44px rgba(255,184,77,.11);border-color:rgba(255,184,77,.26)}
  .issue .head{display:flex;align-items:baseline;gap:12px;flex-wrap:wrap;margin-bottom:10px}
  .issue .conf{font-family:"JetBrains Mono",monospace;font-size:.58rem;letter-spacing:.16em}
  .issue.crit .conf{color:var(--crit);text-shadow:0 0 10px rgba(255,92,92,.5)}
  .issue.warn .conf{color:var(--warn);text-shadow:0 0 10px rgba(255,184,77,.5)}
  .issue.low .conf{color:var(--txt-faint)}
  .issue h3{font-family:"Space Grotesk",sans-serif;font-size:.98rem;font-weight:600;line-height:1.35;flex:1;min-width:200px}
  .badges{display:flex;gap:8px;margin-left:auto}
  .badge{
    font-family:"JetBrains Mono",monospace;font-size:.64rem;color:var(--txt-soft);
    border:1px solid var(--edge-hi);border-radius:99px;padding:3px 10px;white-space:nowrap;
  }
  .badge b{color:var(--txt)}
  .causes{list-style:none;counter-reset:c}
  .causes li{
    counter-increment:c;display:flex;gap:11px;align-items:baseline;
    padding:6px 0;font-size:.8rem;color:var(--txt-soft);border-top:1px solid rgba(255,255,255,.06);
  }
  .causes li::before{content:counter(c,decimal-leading-zero);font-family:"JetBrains Mono",monospace;font-size:.64rem;color:var(--txt-faint)}
  .cconf{margin-left:auto;font-family:"JetBrains Mono",monospace;font-size:.6rem;white-space:nowrap}
  .cconf.HIGH{color:var(--crit)}
  .cconf.MED{color:var(--warn)}
  .cconf.LOW{color:var(--txt-faint)}
  .issue .meta{font-family:"JetBrains Mono",monospace;font-size:.64rem;color:var(--txt-faint);margin-top:10px}

  .pane{background:var(--glass);backdrop-filter:blur(20px);-webkit-backdrop-filter:blur(20px);border:1px solid var(--edge);border-top-color:var(--edge-hi);border-radius:18px;padding:18px 20px}
  table{width:100%;border-collapse:collapse;font-size:.82rem}
  th{text-align:left;font-family:"JetBrains Mono",monospace;font-size:.56rem;letter-spacing:.16em;text-transform:uppercase;color:var(--txt-faint);font-weight:500;padding:0 10px 9px 0;border-bottom:1px solid var(--edge-hi)}
  th:last-child,td:last-child{text-align:right}
  td{padding:9px 10px 9px 0;border-bottom:1px solid rgba(255,255,255,.06);color:var(--txt-soft)}
  tr:last-child td{border-bottom:none}
  td.rname{font-family:"JetBrains Mono",monospace;font-size:.74rem;color:var(--txt)}
  td .bar{display:inline-block;height:4px;border-radius:2px;margin-right:9px;vertical-align:middle;background:linear-gradient(90deg,var(--cyan),var(--violet));box-shadow:0 0 8px rgba(62,230,255,.4)}
  td.num{font-variant-numeric:tabular-nums;font-family:"JetBrains Mono",monospace;font-size:.74rem}
  td.num.warn{color:var(--warn);font-weight:600}

  .empty{padding:34px 10px;text-align:center;color:var(--txt-faint);font-size:.85rem}
  .hidden{display:none}

  @media (max-width:1000px){
    .app{grid-template-columns:1fr}
    .nav{position:static;height:auto;margin:12px;flex-direction:row;align-items:center;overflow-x:auto;padding:12px;gap:2px}
    .wordmark{padding:0 12px 0 4px}.wordmark .sub{display:none}.nav .foot{display:none}
    .nav a{white-space:nowrap;margin:0 2px;padding:8px 12px}
    .main{padding:0 12px 32px}.who{margin-left:0}
    .badges{margin-left:0;width:100%}
  }
</style>
</head>
<body>
<div class="aurora"><i class="a"></i><i class="b"></i><i class="c"></i></div>

<div class="app">
  <aside class="nav">
    <div class="wordmark">
      <div class="brand">SENTINEL</div>
      <div class="sub">BlackStone Development</div>
    </div>
    <a href="/">Overview</a>
    <a href="/timeline.html">Timeline</a>
    <a class="active" href="/performance.html">Performance</a>
    <a href="#">Economy</a>
    <a href="/players.html">Players</a>
    <a href="#">Staff Log</a>
    <a href="#">Alerts</a>
    <a href="#">Settings</a>
    <div class="foot">
      <div class="st"><span class="pulse" id="agent-pulse"></span> <span id="agent-state">Connecting…</span></div>
      <div id="agent-note">—</div>
    </div>
  </aside>

  <div class="main">
    <header class="topbar">
      <div class="server-select">srv_FAKE_LEGACY_RP</div>
      <nav class="subtabs" id="views">
        <button class="on" data-view="issues">Issues</button>
        <button data-view="resources">Resources</button>
      </nav>
      <div class="who">
        <span class="role">OWNER</span>
        <div class="avatar">BW</div>
      </div>
    </header>

    <div class="pagehead">
      <h1 class="disp">Performance</h1>
      <span class="count"><b id="issue-count">0</b> open issues · <b id="hitch-count">0</b> hitches observed</span>
    </div>

    <!-- Issues view -->
    <section id="view-issues">
      <div class="issues" id="issues">
        <div class="pane"><div class="empty">No hitch issues — the server is running clean.</div></div>
      </div>
    </section>

    <!-- Resources view -->
    <section id="view-resources" class="hidden">
      <section class="pane">
        <table>
          <thead><tr><th>Resource</th><th>Avg</th><th>Peak</th></tr></thead>
          <tbody id="resmon"><tr><td class="rname">—</td><td class="num">—</td><td class="num">—</td></tr></tbody>
        </table>
      </section>
    </section>
  </div>
</div>

<script>
const $ = (id) => document.getElementById(id);

function esc(s){ return String(s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])); }
function ts(ms){ return new Date(ms).toLocaleTimeString([], { hour: '2-digit', minute: '2-digit', second: '2-digit' }); }

function issueCard(f) {
  const sev = f.confidence === 'HIGH' ? 'crit' : f.confidence === 'MED' ? 'warn' : 'low';
  const causes = (f.causes || []).map(c =>
    `<li><span>${esc(c.detail)}</span><span class="cconf ${c.confidence}">${c.confidence}</span></li>`
  ).join('');
  return `
  <article class="issue ${sev}">
    <div class="head">
      <span class="conf">${f.confidence} · HITCH ISSUE</span>
      <h3>${esc(f.causes?.[0]?.detail || 'Unattributed hitches — likely external (host, OS, disk)')}</h3>
      <div class="badges">
        <span class="badge"><b>${f.count}</b>×</span>
        <span class="badge">worst <b>${f.worst_ms} ms</b></span>
      </div>
    </div>
    <ol class="causes">${causes}</ol>
    <div class="meta">first seen ${ts(f.first_seen)} · last seen ${ts(f.last_seen)} · key ${esc(f.top_cause)}</div>
  </article>`;
}

async function refresh() {
  try {
    const [fr, or_] = await Promise.all([fetch('/v1/findings'), fetch('/v1/overview')]);
    const fo = await fr.json();
    const o = await or_.json();

    $('agent-pulse').classList.remove('dead');
    $('agent-state').textContent = 'Backend linked';
    $('agent-note').textContent = 'refreshing every 3 s';

    const issues = (fo.findings || []).filter(f => f.type === 'perf.hitch_issue');
    $('issue-count').textContent = issues.length;
    $('hitch-count').textContent = o.hitches_today ?? 0;

    if (issues.length) {
      $('issues').innerHTML = issues.map(issueCard).join('');
    } else {
      $('issues').innerHTML = '<div class="pane"><div class="empty">No hitch issues — the server is running clean.</div></div>';
    }

    if (o.resources?.length) {
      const maxAvg = Math.max(...o.resources.map(r => r.avg_ms), 0.01);
      $('resmon').innerHTML = o.resources.map(r =>
        `<tr><td class="rname"><span class="bar" style="width:${Math.max(8, Math.round((r.avg_ms / maxAvg) * 60))}px"></span>${esc(r.name)}</td>` +
        `<td class="num${r.avg_ms > 1.5 ? ' warn' : ''}">${r.avg_ms} ms</td>` +
        `<td class="num${r.peak_ms > 20 ? ' warn' : ''}">${r.peak_ms} ms</td></tr>`
      ).join('');
    }
  } catch (err) {
    $('agent-pulse').classList.add('dead');
    $('agent-state').textContent = 'Backend unreachable';
    $('agent-note').textContent = 'is server.js running?';
  }
}

$('views').addEventListener('click', (e) => {
  const btn = e.target.closest('button');
  if (!btn) return;
  document.querySelectorAll('#views button').forEach(b => b.classList.remove('on'));
  btn.classList.add('on');
  $('view-issues').classList.toggle('hidden', btn.dataset.view !== 'issues');
  $('view-resources').classList.toggle('hidden', btn.dataset.view !== 'resources');
});

refresh();
setInterval(refresh, 3000);
</script>
</body>
</html>
