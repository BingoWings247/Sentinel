<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Sentinel — Performance</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;600;700&family=Inter:wght@400;500;600&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
<link rel="stylesheet" href="/sentinel.css">
</head>
<body>
<div class="aurora"><i class="a"></i><i class="b"></i><i class="c"></i></div>

<div class="app">
    <aside class="nav" id="nav"></aside>
  <script src="/shell.js"></script>

  <div class="main">
    <header class="topbar">
      <div class="server-select">srv_FAKE_LEGACY_RP</div>
      <nav class="subtabs" id="views">
        <button class="on" data-view="issues">Issues</button>
        <button data-view="resources">Resources</button>
      </nav>
      <div class="who">
        <span class="role">OWNER</span>
        <div class="avatar">BW</div>
      </div>
    </header>

    <div class="pagehead">
      <h1 class="disp">Performance</h1>
      <span class="count"><b id="issue-count">0</b> open issues · <b id="hitch-count">0</b> hitches observed</span>
    </div>

    <!-- Issues view -->
    <section id="view-issues">
      <div class="issues" id="issues">
        <div class="pane"><div class="empty">No hitch issues — the server is running clean.</div></div>
      </div>
    </section>

    <!-- Resources view -->
    <section id="view-resources" class="hidden">
      <section class="pane">
        <table>
          <thead><tr><th>Resource</th><th>Avg</th><th>Peak</th></tr></thead>
          <tbody id="resmon"><tr><td class="rname">—</td><td class="num">—</td><td class="num">—</td></tr></tbody>
        </table>
      </section>
    </section>
  </div>
</div>

<script>
const $ = (id) => document.getElementById(id);

function esc(s){ return String(s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])); }
function ts(ms){ return new Date(ms).toLocaleTimeString([], { hour: '2-digit', minute: '2-digit', second: '2-digit' }); }

function issueCard(f) {
  const sev = f.confidence === 'HIGH' ? 'crit' : f.confidence === 'MED' ? 'warn' : 'low';
  const causes = (f.causes || []).map(c =>
    `<li><span>${esc(c.detail)}</span><span class="cconf ${c.confidence}">${c.confidence}</span></li>`
  ).join('');
  return `
  <article class="issue ${sev}">
    <div class="head">
      <span class="conf">${f.confidence} · HITCH ISSUE</span>
      <h3>${esc(f.causes?.[0]?.detail || 'Unattributed hitches — likely external (host, OS, disk)')}</h3>
      <div class="badges">
        <span class="badge"><b>${f.count}</b>×</span>
        <span class="badge">worst <b>${f.worst_ms} ms</b></span>
      </div>
    </div>
    <ol class="causes">${causes}</ol>
    <div class="meta">first seen ${ts(f.first_seen)} · last seen ${ts(f.last_seen)} · key ${esc(f.top_cause)}</div>
  </article>`;
}

async function refresh() {
  try {
    const [fr, or_] = await Promise.all([fetch('/v1/findings'), fetch('/v1/overview')]);
    const fo = await fr.json();
    const o = await or_.json();

    $('agent-pulse').classList.remove('dead');
    $('agent-state').textContent = 'Backend linked';
    $('agent-note').textContent = 'refreshing every 3 s';

    const issues = (fo.findings || []).filter(f => f.type === 'perf.hitch_issue');
    $('issue-count').textContent = issues.length;
    $('hitch-count').textContent = o.hitches_today ?? 0;

    if (issues.length) {
      $('issues').innerHTML = issues.map(issueCard).join('');
    } else {
      $('issues').innerHTML = '<div class="pane"><div class="empty">No hitch issues — the server is running clean.</div></div>';
    }

    if (o.resources?.length) {
      const maxAvg = Math.max(...o.resources.map(r => r.avg_ms), 0.01);
      $('resmon').innerHTML = o.resources.map(r =>
        `<tr><td class="rname"><span class="bar" style="width:${Math.max(8, Math.round((r.avg_ms / maxAvg) * 60))}px"></span>${esc(r.name)}</td>` +
        `<td class="num${r.avg_ms > 1.5 ? ' warn' : ''}">${r.avg_ms} ms</td>` +
        `<td class="num${r.peak_ms > 20 ? ' warn' : ''}">${r.peak_ms} ms</td></tr>`
      ).join('');
    }
  } catch (err) {
    $('agent-pulse').classList.add('dead');
    $('agent-state').textContent = 'Backend unreachable';
    $('agent-note').textContent = 'is server.js running?';
  }
}

$('views').addEventListener('click', (e) => {
  const btn = e.target.closest('button');
  if (!btn) return;
  document.querySelectorAll('#views button').forEach(b => b.classList.remove('on'));
  btn.classList.add('on');
  $('view-issues').classList.toggle('hidden', btn.dataset.view !== 'issues');
  $('view-resources').classList.toggle('hidden', btn.dataset.view !== 'resources');
});

refresh();
setInterval(refresh, 3000);
</script>
</body>
</html>
